version: 2

project_name: jend

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/jend
    binary: jend
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    # this name template makes the archive name compatible with the standard names
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows
    format_overrides:
    - goos: windows
      format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew Tap Configuration
brews:
  - name: jend
    repository:
      owner: darkprince558
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    
    # Formula Description
    description: "JEND: Just Enough Network Drop - Modern, secure, P2P file transfer."
    homepage: "https://github.com/darkprince558/jend"
    license: "MIT"

    # Install instructions
    install: |
      bin.install "jend"

# Scoop Bucket Configuration (Windows)
scoops:
  - name: jend
    repository:
      owner: darkprince558
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    description: "JEND: Just Enough Network Drop - Modern, secure, P2P file transfer."
    homepage: "https://github.com/darkprince558/jend"
    license: MIT

# nFPM Configuration (Linux Packagers)
nfpms:
  - id: jend
    vendor: "darkprince558"
    homepage: "https://github.com/darkprince558/jend"
    maintainer: "darkprince558 <darkprince558@users.noreply.github.com>"
    description: "JEND: Just Enough Network Drop - Modern, secure, P2P file transfer."
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils

# Winget Configuration (Windows)
winget:
  - name: jend
    publisher: darkprince558
    license: MIT
    license_url: "https://github.com/darkprince558/JEND/blob/main/LICENSE"
    short_description: "JEND: Just Enough Network Drop - Modern, secure, P2P file transfer."
    homepage: "https://github.com/darkprince558/jend"
    repository:
      owner: darkprince558
      name: winget-pkgs
    commit_author:
      name: "goreleaserbot"
      email: "bot@goreleaser.com"

# AUR Configuration (Arch Linux)
aurs:
  - name: jend-bin
    homepage: "https://github.com/darkprince558/jend"
    description: "JEND: Just Enough Network Drop - Modern, secure, P2P file transfer."
    maintainers:
      - "darkprince558 <darkprince558@users.noreply.github.com>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/jend-bin.git"
    package: |-
      # bin
      install -Dm755 "./jend" "${pkgdir}/usr/bin/jend"

